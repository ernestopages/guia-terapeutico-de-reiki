<style>

:root{--bg:#140F24;--bg2:#1B1530;--card:#221A3A;--card2:#2A2146;--line:#3A2F5A;--ink:#F6F1E6;--mu:#BDB3D0;--gold:#C7A257;--gold2:#E9C87A;--or:#B9874A;--gr:#25936F;--gr2:#1F7A5C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{font-family:M,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);background-image:radial-gradient(ellipse 120% 40% at 50% -5%,#3a2a66 0%,transparent 70%);background-repeat:no-repeat}
body.lock{overflow:hidden}
h1,h2,h3,.brand{font-family:M,system-ui,sans-serif;font-weight:900;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 46px}
/* topo */
.top{position:sticky;top:0;z-index:5;background:rgba(20,15,36,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:46px}
.brand{font-size:18px;flex:1;letter-spacing:-.01em}
.brand b{color:var(--gold)}
.brand span{color:var(--mu);font-weight:800}
.pill{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:30px;padding:10px 16px;font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap}
.top .ttl{font:900 17px/1.2 M,system-ui;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#3d2c70 0%,#140F24 65%)}
.login .box{max-width:420px;margin:0 auto;width:100%}
.login img.cv{width:min(64vw,250px);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(233,200,122,.25);margin-bottom:26px}
.login h1{font-family:DS,Georgia,serif;font-weight:400;font-size:31px;line-height:1.15;margin-bottom:10px}
.login h1 em{font-style:normal;color:var(--gold2)}
.login p{color:var(--mu);margin-bottom:22px;font-size:18px}
.login input{width:100%;font:inherit;font-size:20px;padding:18px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:#222;text-align:center;outline:0}
.login input:focus{border-color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:800;font-size:20px;padding:17px 18px;border-radius:16px;min-height:60px;text-align:center}
.btn.go{background:linear-gradient(180deg,#2aa57c,var(--gr2));color:#fff;margin-top:14px;box-shadow:0 8px 22px rgba(31,122,92,.4)}
.btn.go:active{transform:scale(.98)}
.err{background:#3b1913;border:1px solid #7a2e22;color:#ffd5cc;border-radius:14px;padding:13px 15px;margin-top:14px;font-size:16px;text-align:left}
.help{margin-top:18px;font-size:15px;color:var(--mu)}
/* home */
.hello{padding:26px 0 8px}
.hello h1{font-family:DS,Georgia,serif;font-weight:400;font-size:32px}
.hello p{color:var(--mu);margin-top:8px;font-size:18px}
.rowh{display:flex;align-items:center;gap:10px;margin:30px 0 4px}
.rowh h2{font-size:21px}
.rowh .cnt{background:var(--gold);color:#22183A;font:900 14px M;border-radius:20px;padding:3px 10px}
.rowsub{color:var(--mu);font-size:16px;margin:0 0 12px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -18px 0;padding:6px 18px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 clamp(150px,43vw,200px);scroll-snap-align:start;display:block}
.poster{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:var(--card);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);transition:transform .15s}
.tile:active .poster{transform:scale(.96)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ok{position:absolute;left:8px;top:8px;background:var(--gr);color:#fff;font-weight:800;font-size:13px;padding:5px 11px;border-radius:30px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.cap{margin-top:10px;font-weight:800;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.lock .poster img{filter:saturate(.8) brightness(.72)}
.tile.lock .shade{position:absolute;top:8px;right:8px}
.tile.lock .shade span{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}.tile.lock .shade svg{width:17px;height:17px}
.pr{position:absolute;left:8px;bottom:8px;background:var(--gold);color:#22183A;font:900 15px M;padding:6px 12px;border-radius:30px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.pr s{font:600 12px system-ui;opacity:.65;margin-right:5px}
.tile .cta{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(199,162,87,.16);color:var(--gold2);border:1px solid rgba(199,162,87,.5);font-weight:800;font-size:15px;padding:8px 14px;border-radius:30px}
.link{display:block;width:100%;text-align:center;color:var(--gold2);font-weight:700;text-decoration:underline;padding:16px;font-size:16px;margin-top:14px}
.foot{text-align:center;color:var(--mu);font-size:14px;padding:18px 0 8px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#E9C87A,#B48A3E);color:#22183A;font:800 19px M;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25);flex:none}
.av.big{width:56px;height:56px;font-size:24px}
#perfil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#perfil .sheet{position:relative;width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#perfil .x{position:absolute;right:12px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink);font-size:26px;line-height:1}
.pfh{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.pfh b{display:block;font-size:20px}.pfh small{display:block;color:var(--mu);font-size:15px;word-break:break-all}
.pfs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.pfs span{display:block;font:800 12px M;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.pfs a{display:block;color:var(--gold2);font-weight:700;font-size:17px;margin:6px 0;word-break:break-all}
.pfs small{color:var(--mu);font-size:14px}
.pfn{display:block;text-align:center;color:var(--mu);font-size:14px;margin-top:8px}
.btn.out{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:14px}
.mhero{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:18px;padding:14px;border-radius:20px;background:linear-gradient(160deg,#2E2252,#1B1530);border:1px solid rgba(233,200,122,.35);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.mhero img{width:92px;height:92px;flex:none;object-fit:cover;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.mhero .mt{flex:1;min-width:0;display:contents}
.mhero .mt>div{flex:1;min-width:0}
.mhero .tag{display:inline-block;background:var(--gold);color:#22183A;font:900 11px M;letter-spacing:.12em;padding:4px 10px;border-radius:30px}
.mhero h1{font-family:DS,Georgia,serif;font-weight:400;font-size:22px;line-height:1.15;margin-top:6px}
.mgo{flex:1 0 100%;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#2aa57c,var(--gr2));color:#fff;font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 6px 18px rgba(31,122,92,.35)}
.mhero:active{transform:scale(.98)}

.phero{position:relative;display:flex;gap:16px;align-items:center;padding:22px 0 8px}
.phero img{width:104px;height:104px;border-radius:18px;object-fit:cover;flex:none;box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1)}
.phero h1{font-family:DS,Georgia,serif;font-weight:400;font-size:25px;line-height:1.15}
.phero p{color:var(--mu);font-size:16px;margin-top:6px}
.blk{margin:26px 0 12px;font:900 13px M;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.blk:after{content:"";flex:1;height:1px;background:var(--line)}
.sep{height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px 0 4px;opacity:.7}
.folder{display:flex;align-items:center;gap:16px;padding:26px 18px;margin-top:22px;border-radius:22px;background:linear-gradient(135deg,#E9C87A,#B48A3E);color:#22183A;box-shadow:0 12px 30px rgba(199,162,87,.3);margin-bottom:6px}
.folder:active{transform:scale(.98)}
.folder .fi{width:76px;height:76px;border-radius:18px;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex:none}
.folder .ft{flex:1}
.folder b{display:block;font:900 26px M}
.folder small{display:block;font-size:16px;margin-top:3px;font-weight:600}
.folder .go{width:52px;height:52px;border-radius:50%;background:#22183A;color:#E9C87A;display:flex;align-items:center;justify-content:center;flex:none}
.tip{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:13px 15px;font-size:16px;margin:16px 0 4px;color:var(--ink)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.dh{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.dh img{width:62px;height:88px;object-fit:cover;object-position:top;border-radius:9px;background:#fff;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.dh h3{font-size:18px;line-height:1.25}
.dh .sub{font-size:15px;color:var(--mu);margin-top:4px}
.acts{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:9px}
.a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:66px;border-radius:14px;font-weight:800;font-size:15px;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.a:active{transform:scale(.96)}
.a.open{background:linear-gradient(180deg,#2aa57c,var(--gr2));border-color:transparent;color:#fff}
/* bônus 4: ferramentas */
.doc.lst{display:block}
.a.wide{flex-direction:row;gap:8px;min-height:58px;font-size:17px}
.thero{padding:22px 0 4px}
.thero .tag{display:inline-block;background:var(--gold);color:#22183A;font:900 13px M;letter-spacing:.1em;padding:5px 12px;border-radius:30px}
.thero h1{font-size:25px;margin-top:10px}
.thero p{color:var(--mu);font-size:16px;margin-top:8px}
.thero p b{color:var(--gold2)}
.tool{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.tool:active{transform:scale(.98)}
.ti{position:relative;flex:none;width:104px;height:104px;border-radius:14px;overflow:hidden;background:#fff}
.ti img{width:100%;height:100%;object-fit:contain;display:block}
.ti em{position:absolute;left:0;right:0;bottom:0;background:rgba(20,15,36,.85);color:var(--gold2);font:800 11px system-ui;font-style:normal;text-align:center;padding:3px 0}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:17px;line-height:1.25}
.tx small{display:block;color:var(--mu);font-size:15px;margin-top:4px;line-height:1.35}

.vbar{display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;background:#1B1530;border-bottom:1px solid var(--line)}

.vt{flex:1;font:800 15px/1.2 M,system-ui;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpn{font-size:14px;color:var(--mu);white-space:nowrap}
.vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#2a221a;position:relative}

.pg canvas{width:100%;height:100%;display:block}
.pg .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#BDB3D0;font-size:15px}
.vload{position:absolute;left:0;right:0;top:40%;text-align:center;color:var(--mu);font-size:18px;padding:0 20px}
.vfoot{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#1B1530;border-top:1px solid var(--line)}
.vfoot .a{min-height:58px;flex-direction:row;gap:8px;font-size:16px}
.vfoot .a.z{font-size:26px;font-weight:700}
/* impressão */
#pm{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
#pm .c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;max-width:380px;width:100%;text-align:center}
#pm h3{font-size:21px;margin-bottom:10px}
#pm p{color:var(--mu);font-size:17px;margin-bottom:16px}
#pm .bar{height:12px;border-radius:8px;background:#0c0917;overflow:hidden;margin:14px 0 6px}
#pm .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--or));transition:width .2s}
#pm .btn{font-size:18px;min-height:54px;margin-top:10px}
#pm .btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:#fff;color:#22183A;padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:520px;margin:0 auto}
.spin{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--mu)}
#pa{display:none}
@media (min-width:700px){html{font-size:18px}}
@media print{
 @page{size:A4;margin:0}
 body.printing{background:#fff!important}
 body.printing #app,body.printing #viewer,body.printing .toast,body.printing #pm{display:none!important}
 body.printing #pa{display:block}
 #pa img{display:block;width:210mm;height:297mm;break-after:page;page-break-after:always}
 #pa img:last-child{break-after:auto;page-break-after:auto}
}

const BUF = {};
async function getBuf(i, onp) {
  if (BUF[i.file]) return BUF[i.file];
  const r = await fetch(pdfUrl(i)); if (!r.ok) throw new Error('http ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (r.body && r.body.getReader && total) {
    const rd = r.body.getReader(), ch = []; let got = 0;
    for (;;) { const x = await rd.read(); if (x.done) break; ch.push(x.value); got += x.value.length; if (onp) onp(Math.min(1, got / total)); }
    const out = new Uint8Array(got); let o = 0; ch.forEach(c => { out.set(c, o); o += c.length; });
    BUF[i.file] = out.buffer;
  } else BUF[i.file] = await r.arrayBuffer();
  return BUF[i.file];
}
function ensurePdfjs() {
  return new Promise((res, rej) => {
    if (window.pdfjsLib) { res(); return; }
    const s = document.createElement('script'); s.src = A + 'vendor/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(A + 'vendor/pdf.worker.min.js', location.href).href; res(); };
    s.onerror = () => rej(new Error('pdfjs')); document.head.appendChild(s);
  });
}

    await Promise.all([...pa.querySelectorAll('img')].map(i => (i.decode ? i.decode().catch(() => {}) : 0)));
    if (me.cancel) return;
    pmShow(`<h3>Tudo pronto!</h3><p>A janela de impressão vai abrir. Escolha a sua impressora e confirme. Se não abrir, toque no botão abaixo.</p><button class="btn go" id="pmp">${ic('pr')} Abrir a impressão</button><button class="btn sec" id="pmx">Fechar</button>`);
    $('#pmp').onclick = runPrint; $('#pmx').onclick = pmClose;
    runPrint();
  } catch (e) {
    pmShow(`<h3>Não deu certo</h3><p>Não foi possível preparar a impressão agora. Confira a internet e tente de novo.</p><button class="btn sec" id="pmx">Fechar</button>`);
    $('#pmx').onclick = pmClose;
  }
}

/* ---------- leitor de PDF dentro do app ---------- */
let V = null;
const ZOOMS = [1, 1.5, 2, 3];
function closeViewer() {
  if (!V) return;
  try { V.obs.disconnect(); if (V.pdf) V.pdf.destroy(); } catch (e) {}
  const v = $('#viewer'); if (v) v.remove(); document.body.classList.remove('lock'); V = null;
}
async function showViewer(id) {
  const d = DOCS[id];
  if (!d || !owns(d.product.id)) { location.hash = ''; return; }
  if (V && V.id === id) return;
  closeViewer();
  const v = document.createElement('div'); v.id = 'viewer';
  v.innerHTML = `<div class="vbar"><button class="pill" id="vb">‹ Voltar</button><div class="vt">${esc(d.item.title)}</div><div class="vpn" id="vpn"></div></div>
    <div class="vscroll" id="vs"><div class="vpages" id="vp"></div><div class="vload" id="vl">Abrindo o guia…</div></div>
    <div class="vfoot"><button class="a open" id="vdl">${ic('dl', 22)}Baixar</button><button class="a" id="vpr">${ic('pr', 22)}Imprimir</button><button class="a z" id="vzm">−</button><button class="a z" id="vzp">+</button></div>`;
  document.body.appendChild(v); document.body.classList.add('lock');
  V = { id, pdf: null, zoom: 0, obs: { disconnect() {} } };
  const me = V;
  $('#vb').onclick = () => { if (S.fromList) history.back(); else location.hash = S.base || ''; };
  $('#vdl').onclick = () => downloadDoc(id);
  $('#vpr').onclick = () => printDoc(id);
  track('abriu', d.item.title);
  try {
    await ensurePdfjs();
    const task = pdfjsLib.getDocument({ url: pdfUrl(d.item) });
    task.onProgress = p => { if (p.total && $('#vl')) $('#vl').textContent = 'Carregando o guia… ' + Math.min(100, Math.round(p.loaded / p.total * 100)) + '%'; };
    const pdf = await task.promise; if (V !== me) { pdf.destroy(); return; }
    me.pdf = pdf;
    const p1 = await pdf.getPage(1), vp1 = p1.getViewport({ scale: 1 });
    const box = $('#vp'), sc = $('#vs'); $('#vl').remove();
    const pages = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const g = document.createElement('div'); g.className = 'pg'; g.dataset.n = n; g.style.aspectRatio = vp1.width + '/' + vp1.height;
      g.innerHTML = '<div class="n">Página ' + n + '</div>'; box.appendChild(g); pages.push(g);
    }
    const renderPg = async g => {
      if (g._r || V !== me) return; g._r = 1;
      try {
        const pg = await pdf.getPage(+g.dataset.n); if (!g.isConnected || V !== me) return;
        const w = g.clientWidth, k = Math.min(window.devicePixelRatio || 1, 2), vp = pg.getViewport({ scale: (w / pg.getViewport({ scale: 1 }).width) * k });
        const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        if (!g._r) return; g.innerHTML = ''; g.appendChild(c);
      } catch (e) { g._r = 0; }
    };
    const watch = () => {
      me.obs.disconnect();
      me.obs = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) renderPg(e.target);
        else if (e.target._r) { e.target._r = 0; e.target.innerHTML = '<div class="n">Página ' + e.target.dataset.n + '</div>'; }
      }), { root: sc, rootMargin: '900px 0px' });
      pages.forEach(g => me.obs.observe(g));
    };
    const setZoom = z => {
      me.zoom = Math.max(0, Math.min(ZOOMS.length - 1, z));
      box.style.width = (ZOOMS[me.zoom] * 100) + '%';
      pages.forEach(g => { g._r = 0; g.innerHTML = '<div class="n">Página ' + g.dataset.n + '</div>'; });
      watch();
    };
    $('#vzp').onclick = () => setZoom(me.zoom + 1);
    $('#vzm').onclick = () => setZoom(me.zoom - 1);
    const pn = $('#vpn'); let tk = 0;
    const upd = () => { tk = 0; const top = sc.getBoundingClientRect().top + 60; let cur = 1; for (const g of pages) { if (g.getBoundingClientRect().bottom > top) { cur = +g.dataset.n; break; } } pn.textContent = 'Pág. ' + cur + '/' + pdf.numPages; };
    sc.addEventListener('scroll', () => { if (!tk) tk = requestAnimationFrame(upd); }, { passive: true });
    setZoom(0); upd();
  } catch (e) {
    const l = $('#vl'); if (l) l.innerHTML = 'Não foi possível abrir o guia aqui.<br><br><button class="btn go" id="vo">Tentar abrir de outro jeito</button>';
    const o = $('#vo'); if (o) o.onclick = () => window.open(pdfUrl(d.item), '_blank');
  }
}

/* ---------- perfil ---------- */
function openProfile() {
  const o = document.createElement('div'); o.id = 'perfil';
  const nm = firstName(S.name);
  o.innerHTML = `<div class="sheet" role="dialog" aria-label="Meu perfil"><button class="x" id="pfx" aria-label="Fechar">×</button>
    <div class="pfh"><span class="av big">${esc((nm || S.email || '?').charAt(0).toUpperCase())}</span><div><b>${esc(nm || 'Meu perfil')}</b><small>${esc(S.email)}</small></div></div>
    <div class="pfs"><span>Suporte</span><a href="mailto:${esc(CFG.SUPORTE_EMAIL)}">${esc(CFG.SUPORTE_EMAIL)}</a><small>Dúvidas ou problemas com o acesso? Escreva para este e-mail.</small></div>
    <button class="btn go" id="pfr">Atualizar a plataforma</button>
    <small class="pfn">Comprou outro guia e ele ainda não apareceu? Toque em atualizar.</small>
    <button class="btn out" id="pfo">Sair</button></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.addEventListener('click', e => { if (e.target === o) close(); });
  $('#pfx').onclick = close;
  $('#pfo').onclick = () => { close(); logout(); };
  $('#pfr').onclick = async () => {
    $('#pfr').textContent = 'Atualizando…'; await refreshOwned();
    try { const r = await navigator.serviceWorker?.getRegistration(); if (r) await r.update(); } catch (e) {}
    close(); renderBase(location.hash || ''); toast('Plataforma atualizada.', 2500);
  };
}

/* ---------- roteamento ---------- */
function renderBase(h) {
  const app = $('#app');
  const mp = h.match(/^#\/p\/(\w+)(?:\/f\/(\w+))?/);
  const p = mp && PRODUCTS.find(x => x.id === mp[1]);
  const ml = h.match(/^#\/p\/(\w+)\/l\/(\w+)/);
  if (ml && p && owns(p.id)) {
    app.innerHTML = viewTools(); window.scrollTo(0, 0);
    $('#bk').onclick = () => { location.hash = '#/p/' + p.id; };
    track('abriu', 'Bônus 00 · Surpresa Especial');
    return;
  }
  if (p && owns(p.id)) {
    const b = mp[2] && p.blocks.find(x => x.type === 'folder' && x.id === mp[2]);
    if (mp[2] && !b) { location.hash = '#/p/' + p.id; return; }
    app.innerHTML = b ? viewFolder(p, b) : viewProduct(p); window.scrollTo(0, 0);
    $('#bk').onclick = () => { if (b) location.hash = '#/p/' + p.id; else location.hash = ''; };
    if (!b) track('abriu', p.title);
    return;
  }
  if (p) { location.hash = ''; return; }
  app.innerHTML = viewHome(); window.scrollTo(0, 0);
  $('#pf').onclick = openProfile;
  app.querySelectorAll('[data-buy]').forEach(a => a.addEventListener('click', e => {
    const q = PRODUCTS.find(x => x.id === a.dataset.buy);
    track('interesse', 'Clicou para comprar: ' + q.title);
    store.set('rk_buying', String(Date.now()));
    if (!q.buy) { e.preventDefault(); toast('Em breve você poderá garantir este guia por aqui.', 4000); }
  }));
}
function route() {
  const app = $('#app');
  if (!S.email) {
    closeViewer(); app.innerHTML = viewLogin();
    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('#gb'); b.disabled = true; b.textContent = 'Entrando…';
      const r = await doLogin($('#em').value);
      if (r.ok) { track('login', 'Entrou no app'); location.hash = ''; route(); }
      else { b.disabled = false; b.textContent = 'Entrar'; $('#msg').innerHTML = `<div class="err">${esc(r.msg)}</div>`; }
    });
    return;
  }
  const h = location.hash, m = h.match(/^#\/ler\/(\w+)/);
  if (m) {
    if (S.base == null) { S.base = ''; renderBase(''); }
    showViewer(m[1]); return;
  }
  closeViewer(); S.fromList = false; S.base = h;
  renderBase(h);
  if (S.restoreY != null) { const y = S.restoreY; S.restoreY = null; window.scrollTo(0, y); }
}
window.addEventListener('hashchange', route);
/* cliques dos botões de cada guia */
document.addEventListener('click', e => {
  const tl = e.target.closest('[data-tool]'); if (tl) { track('ferramenta', 'Clicou: ' + tl.dataset.tool); return; }
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-dl]'), p = e.target.closest('[data-pr]');
  if (o) { S.restoreY = window.scrollY; S.fromList = true; location.hash = '#/ler/' + o.dataset.open; }
  else if (d) downloadDoc(d.dataset.dl);
  else if (p) printDoc(p.dataset.pr);
});
/* ao voltar do checkout, atualiza o que ela já comprou */
async function onBack() {
  if (!S.email || !store.get('rk_buying')) return;
  store.del('rk_buying'); const before = S.owned.length;
  await refreshOwned(); if (S.owned.length !== before) { renderBase(location.hash || ''); toast('Seu novo guia foi liberado!', 5000); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onBack(); });
window.addEventListener('pageshow', e => { if (e.persisted) onBack(); });

(async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const saved = store.get('rk_email');
  if (saved) { const r = await doLogin(saved); if (!r.ok) { route(); return; } }
  route();
})();
</script></body></html>
